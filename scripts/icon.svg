<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Red background -->
  <rect width="512" height="512" fill="#CC0000"/>

  <!-- ══ SOCCER BALL — centred at (256, 310) r=158 ══ -->
  <circle cx="256" cy="310" r="158" fill="white"/>
  <!-- Black patches -->
  <circle cx="256" cy="310" r="42" fill="#111"/>
  <ellipse cx="256" cy="236" rx="28" ry="35" fill="#111"/>
  <ellipse cx="256" cy="236" rx="28" ry="35" fill="#111" transform="rotate(72,256,310)"/>
  <ellipse cx="256" cy="236" rx="28" ry="35" fill="#111" transform="rotate(144,256,310)"/>
  <ellipse cx="256" cy="236" rx="28" ry="35" fill="#111" transform="rotate(216,256,310)"/>
  <ellipse cx="256" cy="236" rx="28" ry="35" fill="#111" transform="rotate(288,256,310)"/>

  <!-- ══ CROWN — dark, base sitting on top of ball ══ -->
  <!-- Crown base band -->
  <rect x="126" y="188" width="260" height="38" fill="#111" rx="6"/>
  <!-- 5 peaks: outer-tall / inner-short / centre-tall / inner-short / outer-tall -->
  <polygon fill="#111" points="
    126,200
    126,172
    164,80
    202,172
    216,120
    230,172
    256,64
    282,172
    296,120
    310,172
    348,80
    386,172
    386,200
  "/>
  <!-- Jewel circles at peak tips -->
  <circle cx="164" cy="74"  r="16" fill="#111"/>
  <circle cx="216" cy="114" r="12" fill="#111"/>
  <circle cx="256" cy="57"  r="18" fill="#111"/>
  <circle cx="296" cy="114" r="12" fill="#111"/>
  <circle cx="348" cy="74"  r="16" fill="#111"/>
  <!-- Jewel highlight dots (small white dots to suggest gems) -->
  <circle cx="164" cy="74"  r="6" fill="white" opacity="0.5"/>
  <circle cx="216" cy="114" r="4" fill="white" opacity="0.5"/>
  <circle cx="256" cy="57"  r="7" fill="white" opacity="0.5"/>
  <circle cx="296" cy="114" r="4" fill="white" opacity="0.5"/>
  <circle cx="348" cy="74"  r="6" fill="white" opacity="0.5"/>
</svg>
