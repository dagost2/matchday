<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Red background -->
  <rect width="512" height="512" fill="#CC0000"/>

  <!-- ══ CROWN (white) — base resting on top of ball ══ -->
  <!-- Crown base rectangle -->
  <rect x="146" y="218" width="220" height="32" fill="white" rx="6"/>
  <!-- 5 crown peaks: tall / short / tall(centre) / short / tall -->
  <polygon fill="white" points="
    146,222
    146,196
    178,110
    210,196
    222,152
    234,196
    256,96
    278,196
    290,152
    302,196
    334,110
    366,196
    366,222
  "/>
  <!-- Jewel circles at each peak tip -->
  <circle cx="178" cy="105" r="14" fill="white"/>
  <circle cx="222" cy="147" r="11" fill="white"/>
  <circle cx="256" cy="90"  r="15" fill="white"/>
  <circle cx="290" cy="147" r="11" fill="white"/>
  <circle cx="334" cy="105" r="14" fill="white"/>

  <!-- ══ SOCCER BALL (white) — centred at (256, 340) r=140 ══ -->
  <circle cx="256" cy="340" r="140" fill="white"/>
  <!-- Black patches -->
  <!-- Central pentagon -->
  <circle cx="256" cy="340" r="36" fill="#1a1a1a"/>
  <!-- 5 surrounding patches rotated around center -->
  <ellipse cx="256" cy="284" rx="24" ry="30" fill="#1a1a1a"/>
  <ellipse cx="256" cy="284" rx="24" ry="30" fill="#1a1a1a" transform="rotate(72,256,340)"/>
  <ellipse cx="256" cy="284" rx="24" ry="30" fill="#1a1a1a" transform="rotate(144,256,340)"/>
  <ellipse cx="256" cy="284" rx="24" ry="30" fill="#1a1a1a" transform="rotate(216,256,340)"/>
  <ellipse cx="256" cy="284" rx="24" ry="30" fill="#1a1a1a" transform="rotate(288,256,340)"/>
</svg>
